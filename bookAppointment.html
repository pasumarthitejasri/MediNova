<h1 class="title">
Book Appointment
</h1>



<div class="form-box">


<form id="appointmentForm">


<input 
type="text"
id="doctor"
placeholder="Doctor Name"
required>



<input
type="text"
id="department"
placeholder="Department"
required>



<input
type="date"
id="date"
required>



<input
type="time"
id="time"
required>



<textarea
id="reason"
placeholder="Reason for Visit">
</textarea>



<button type="submit">
Book Appointment
</button>


</form>


</div>



<script src="appointment.js"></script>


</body>
